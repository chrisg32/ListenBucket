version: '3.8'

services:
  listenbucket:
    build: .
    container_name: listenbucket
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - BASE_URL=${BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/feeds"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
